<section class="ps-page" id="ps-page" aria-labelledby="ps-title" hidden>
  <div class="ps-toolbar">
    <button
      class="ps-close"
      data-action="close-ps"
      aria-label="Close Problem Statements and return to Home"
    >
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M8 8 24 24M24 8 8 24" />
      </svg></button
    ><span class="ps-toolbar-spark" aria-hidden="true"></span>
  </div>
  <div class="ps-scroll" tabindex="0" aria-label="Problem statement covers">
    <h2 id="ps-title">Problem Statements</h2>
    <div class="ps-grid">
      <button
        class="ps-card"
        data-problem="0"
        aria-label="Problem Statement 1"
        aria-pressed="false"
      >
        <img
          src="assets/problem-1.png"
          alt="Three armored crewmates in colorful beams of light"
          width="429"
          height="512"
        /><span class="ps-card-caption">Problem Statement 01</span></button
      ><button
        class="ps-card"
        data-problem="1"
        aria-label="Problem Statement 2"
        aria-pressed="false"
      >
        <img
          src="assets/problem-2.png"
          alt="Costumed crewmates with a goose and yellow alien"
          width="429"
          height="512"
        /><span class="ps-card-caption">Problem Statement 02</span></button
      ><button
        class="ps-card"
        data-problem="2"
        aria-label="Problem Statement 3"
        aria-pressed="false"
      >
        <img
          src="assets/problem-3.png"
          alt="Crewmates racing on a bright track"
          width="429"
          height="512"
        /><span class="ps-card-caption">Problem Statement 03</span></button
      ><button
        class="ps-card"
        data-problem="3"
        aria-label="Problem Statement 4"
        aria-pressed="false"
      >
        <img
          src="assets/problem-4.png"
          alt="Green and pink crewmates floating above the clouds"
          width="429"
          height="512"
        /><span class="ps-card-caption">Problem Statement 04</span></button
      ><button
        class="ps-card"
        data-problem="4"
        aria-label="Problem Statement 5"
        aria-pressed="false"
      >
        <img
          src="assets/problem-5.png"
          alt="Fox and dragon costumed crewmates in a dark forest"
          width="429"
          height="512"
        /><span class="ps-card-caption">Problem Statement 05</span>
      </button>
    </div>
  </div>
</section>
