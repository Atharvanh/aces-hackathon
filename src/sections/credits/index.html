<section
  class="credits-panel"
  id="credits-panel"
  aria-label="ACES DIT credits"
  hidden
>
  <button
    class="credits-close ps-close"
    data-action="close-credits"
    aria-label="Close credits and return to Home"
  >
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M8 8 24 24M24 8 8 24" />
    </svg></button
  ><button
    class="credits-playback"
    data-action="credits-playback"
    aria-label="Pause scrolling credits"
  >
    Pause
  </button>
  <div class="credits-viewport" tabindex="0" aria-label="Tech team credits">
    <div class="credits-roll">
      <div class="credits-intro">
        <img src="assets/aces-logo-hd.png" alt="ACES winged gold shield logo" />
        <h2>ACES DIT</h2>
      </div>
      <div class="credits-team">
        <h3>TECH TEAM</h3>
        <div class="credits-grid">
          <div class="credit-person">
            <h4>Atharva Harale</h4>
          </div>
          <div class="credit-person">
            <h4>Raj Singh</h4>
          </div>
          <div class="credit-person">
            <h4>Arnav Tagade</h4>
          </div>
          <div class="credit-person">
            <h4>Vyankatesh Patil</h4>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
